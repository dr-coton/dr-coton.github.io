{% if site.google_site_verification %}
    <meta name="google-site-verification" content="{{ site.google_site_verification | escape }}">
{% endif %}
{% if site.google_analytics_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id | uri_escape }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics_id | escape }}');
    </script>
{% endif %}
