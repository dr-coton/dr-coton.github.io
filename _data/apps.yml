# 앱 소개의 내용은 App Store 설명과 같게 유지한다. 앱을 더하면 첫 화면과 /apps/에 함께 나온다.
- id: geulpyeon
  name: 글편
  category: 문서 편집
  platforms: iPad · Mac
  icon: /assets/apps/geulpyeon.png
  summary: HWP/HWPX 문서를 열어 본문, 서식, 표를 고치는 문서 편집기입니다.
  points:
    - 파일 앱에서 고른 문서는 원본을 그대로 두고 사본으로 가져와 편집합니다.
    - 편집 내용은 기기 안에 자동으로 보관하고, 이름을 붙인 버전으로 되돌릴 수 있습니다.
    - 수정본은 HWP/HWPX 또는 PDF로 내보냅니다. 같은 이름의 기존 파일을 덮어쓰지 않습니다.
    - 문서 편집은 기기 안에서 처리하며 앱 계정이 필요하지 않습니다.
  note: 한글, 한컴, HWP는 주식회사 한컴의 등록상표이며, 여기서는 지원하는 파일 형식을 설명하는 데에만 사용합니다. 글편은 rhwp 및 주식회사 한컴과 제휴하지 않은 독립 프로젝트입니다.
  store: https://apps.apple.com/kr/app/id6825587727
  news: https://apps.dr-coton.com/ko/geulpyeon
  support: https://dr-coton.com/geulpyeon-support/support.html
  privacy: https://dr-coton.com/geulpyeon-support/privacy.html
- id: mogomi-coloring
  name: 모고미 색칠놀이
  category: 유아 교육
  platforms: iPhone · iPad
  icon: /assets/apps/mogomi-coloring.png
  summary: 만 3~5세 아이의 작은 손으로 즐기는 색칠놀이입니다.
  points:
    - 오리지널 도안 108장과 마음대로 그리는 빈 종이를 8개 묶음으로 담았습니다.
    - 톡 채우기와 칸 안에서 직접 칠하기, 스티커, 색 섞기를 지원합니다.
    - 공유, 사진 저장, 삭제, 설정은 보호자 게이트 뒤에 있습니다.
    - 광고, 계정, 추적이 없고 인터넷이 없어도 모든 도안을 쓸 수 있습니다.
  store: https://apps.apple.com/kr/app/id6824543360
