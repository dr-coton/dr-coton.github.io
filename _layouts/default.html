<!doctype html>
{% assign v = site.time | date: '%s' %}
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'writing' %}article{% else %}website{% endif %}">
    <meta property="og:image" content="{{ page.thumb | default: '/assets/watercolor.png' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ v }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
        <img src="{{ '/assets/favicon.svg' | relative_url }}" width="32" height="36" alt="">
        <span>{{ site.title }}</span>
      </a>
      <nav aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}"{% unless page.url == '/about/' or page.url == '/cats/' %} aria-current="page"{% endunless %}>글 모음</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
        <a href="{{ '/cats/' | relative_url }}"{% if page.url == '/cats/' %} aria-current="page"{% endif %}>고양이</a>
      </nav>
    </header>
    <main id="main" class="shell" tabindex="-1">{{ content }}</main>
    <footer class="site-footer shell">
      <p>{{ site.title }}</p>
      <span>{{ site.author | escape }}</span>
    </footer>
    <div class="cats" aria-hidden="true">
      <div class="cat" data-sprite="{{ '/assets/cats/jango.png' | relative_url }}?v={{ v }}" data-speed="22" data-sleepy="0.35" data-energy="0.25" data-jump="36" data-reach="60" data-fav="fridge|nest" data-stay="1" data-says="그르릉…|냐앙~|여기가 좋아|안 내려갈래"></div>
      <div class="cat" data-sprite="{{ '/assets/cats/deuri.png' | relative_url }}?v={{ v }}" data-speed="30" data-sleepy="0.2" data-energy="0.7" data-jump="80" data-reach="110" data-fav="p4|zero-top" data-hider="1" data-says="야옹|…|빼꼼|다녀왔어?"></div>
    </div>
    <script src="{{ '/assets/soft-nav.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/cats.js' | relative_url }}?v={{ v }}" defer></script>
  </body>
</html>
