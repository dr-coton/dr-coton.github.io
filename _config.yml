title: 꼬박사의 연구노트
author: coton
description: 꼬똥(꼬박사)의 블로그. AI와 소프트웨어 개발, 성능 컨설팅, 아이스크림과 일상 이야기.
url: https://dr-coton.com
baseurl: ""
lang: ko
google_analytics_id: G-TQV27JTKY7
google_site_verification:
plugins:
  - jekyll-sitemap  # /sitemap.xml, /robots.txt (GitHub Pages 기본 지원)
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    default_lang: plaintext
    block:
      line_numbers: true
collections:
  writings:
    output: true
    permalink: /writing/:name/
defaults:
  - scope:
      path: ""
      type: writings
    values:
      layout: writing
topics:
  - 개발
  - 일상
  - 생각
  - 취향
  - 배움
exclude:
  - AGENTS.md
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - tests
  - scripts
